---
- name: Deploy Nginx application to Amazon EKS
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: ap-south-1
    eks_cluster_name: eks-cluster
    kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/config"
    app_namespace: default
    app_name: nginx
    replica_count: 2

  tasks:
    - name: Validate replica count
      ansible.builtin.assert:
        that:
          - replica_count | int >= 1
          - replica_count | int <= 5
        fail_msg: "Replica count must be between 1 and 5."

    - name: Update kubeconfig for EKS
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - update-kubeconfig
          - --region
          - "{{ aws_region }}"
          - --name
          - "{{ eks_cluster_name }}"
          - --kubeconfig
          - "{{ kubeconfig_path }}"
      changed_when: false

    - name: Apply Nginx deployment with selected replicas
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nginx
            namespace: "{{ app_namespace }}"
          spec:
            replicas: "{{ replica_count | int }}"
            selector:
              matchLabels:
                app: nginx
            template:
              metadata:
                labels:
                  app: nginx
              spec:
                containers:
                  - name: nginx
                    image: nginx:stable
                    ports:
                      - containerPort: 80
                    resources:
                      requests:
                        cpu: 100m
                        memory: 64Mi
                      limits:
                        cpu: 250m
                        memory: 128Mi

    - name: Apply Nginx service
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/../../kubernetes/service.yml"
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Wait for selected replicas to become ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ app_name }}"
        namespace: "{{ app_namespace }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: nginx_deployment
      until:
        - nginx_deployment.resources | length > 0
        - nginx_deployment.resources[0].status.readyReplicas | default(0) | int == replica_count | int
      retries: 20
      delay: 15

    - name: Display deployment status
      ansible.builtin.debug:
        msg: "Nginx deployment is ready with {{ replica_count }} replicas."
